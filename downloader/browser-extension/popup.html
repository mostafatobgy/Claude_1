<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Video links on this page</strong>
    <span class="actions">
      <button id="copyAll" title="Copy every link">Copy all</button>
      <button id="clear" title="Empty the list">Clear</button>
    </span>
  </header>
  <ul id="list"></ul>
  <p id="empty" hidden>
    No video seen yet.<br>
    <b>Play the video for a few seconds</b>, then click this icon again.<br>
    <span class="muted">Encrypted (DRM) videos such as Netflix cannot be captured.
    For YouTube, use “Find video…” in the TurboDL app.</span>
  </p>
  <footer class="muted">Copy a link and paste it into TurboDL to download it faster.</footer>
  <script src="popup.js"></script>
</body>
</html>
