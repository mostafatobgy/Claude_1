[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodl"
version = "1.0.0"
description = "Multi-connection download accelerator with pause/resume, a desktop window and a command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# Lets "Find video" read YouTube, Facebook, X, TikTok and 1,800+ other sites.
video = ["yt-dlp"]

[project.scripts]
turbodl = "turbodl.cli:main"

[project.gui-scripts]
turbodl-gui = "turbodl.gui:main"

[tool.setuptools]
packages = ["turbodl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
