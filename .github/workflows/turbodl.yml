name: TurboDL (test and build apps)

# Runs the download-accelerator tests, then builds the ready-to-run Windows app
# (TurboDL.exe). Download it from the run's "Artifacts".
on:
  push:
    paths: ["downloader/**", ".github/workflows/turbodl.yml"]
  workflow_dispatch:
  # Weekly rebuild so the apps carry a fresh yt-dlp (video sites change often).
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest yt-dlp
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
        working-directory: downloader/browser-extension
      - run: xvfb-run -a node test/run.mjs
        working-directory: downloader/browser-extension
      - uses: actions/upload-artifact@v4
        with:
          name: TurboDL-browser-extension
          path: |
            downloader/browser-extension
            !downloader/browser-extension/test
            !downloader/browser-extension/node_modules

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller yt-dlp
      - run: >-
          pyinstaller --onefile --windowed --name TurboDL --icon turbodl/icon.ico
          --add-data "turbodl/icon.ico;turbodl" --collect-all yt_dlp TurboDL.pyw
      # yt-dlp needs a JavaScript runtime to read YouTube with all of its app
      # profiles; without one it falls back to a single profile that YouTube
      # sometimes serves only encrypted video to.
      - name: Add Deno next to TurboDL.exe
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath dist -Force
          dist/deno.exe --version
          Set-Content dist/README.txt "Keep deno.exe in the same folder as TurboDL.exe: TurboDL uses it to read YouTube videos. Start the app with TurboDL.exe."
      - uses: actions/upload-artifact@v4
        with:
          name: TurboDL-Windows
          path: |
            downloader/dist/TurboDL.exe
            downloader/dist/deno.exe
            downloader/dist/README.txt
