name: Update news

on:
  # Main timer: each run starts the next one ~30 minutes later (job "next" below), because GitHub's
  # own schedule is often hours late. The schedule stays as a backup that restarts the chain.
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the "next" job start the following run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: builder/requirements.txt
      - run: pip install -r builder/requirements.txt
      - name: Restore translation cache and sent-alerts list
        uses: actions/cache@v4
        with:
          path: |
            builder/translations.json
            builder/notified.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - run: python -m pytest -q builder/tests
      - run: python builder/build.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:          # only one deploy at a time; the 28-minute wait below doesn't block others
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  next:
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: sleep 1680   # 28 minutes
      - name: Start the next update (unless a newer run already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          newer=$(gh run list --workflow update-news.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.status != \"completed\" and .databaseId > ${{ github.run_id }})] | length")
          if [ "$newer" = "0" ]; then gh workflow run update-news.yml --ref main; else echo "newer run exists"; fi
