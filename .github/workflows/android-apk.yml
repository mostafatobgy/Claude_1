name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write   # to publish the APK as a release download

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk akhbar.apk
      - name: Publish at a fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || \
            gh release create app --title "تطبيق أخبار اليوم" --notes "أحدث نسخة من تطبيق أندرويد. التحميل: akhbar.apk"
          gh release upload app akhbar.apk --clobber
          gh release edit app --notes "أحدث نسخة من تطبيق أندرويد (رقم ${{ github.run_number }}). التحميل: akhbar.apk"
