name: Build Prayer Alarm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "prayer-alarm/**"
      - ".github/workflows/build-prayer-alarm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prayer-alarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-alarm-apk
          path: prayer-alarm/app/build/outputs/apk/debug/app-debug.apk
